<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050d1b">
<title>Telepon — Database Klaim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1220;--panel:#111c2c;--panel2:#152235;--line:#34445a;
  --line-soft:#25364b;--blue:#9aafc9;--muted:#8296b0;--white:#edf2f8;
  --cyan:#55b9c7;--green:#269b68;--green-dark:#176d4b;--amber:#c99b4d;
  --shadow:0 7px 18px rgba(0,0,0,.16);
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--white);font-family:Inter,Roboto,Arial,sans-serif;background:#0b1220}
button,input,select{font:inherit}
button{cursor:pointer}
.app{width:min(100%,1440px);margin:0 auto;padding:25px 40px 54px}
h1{font-size:clamp(29px,3.2vw,46px);line-height:1.15;letter-spacing:-1.3px;margin:0 0 22px;font-weight:800}
.timer-row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:38px}
.timer-label{font-size:clamp(18px,2.2vw,29px);font-weight:700;letter-spacing:-.6px}
.timer{display:flex;align-items:center;gap:9px;font-size:30px;font-weight:700}
.timer-box{min-width:77px;padding:12px 13px;text-align:center;border:2px solid #243956;border-radius:13px;background:#111c2c;box-shadow:none}
.timer-sep{color:#c8d7e9;margin-top:-4px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:min(760px,75%);margin:0 0 43px}
.tab{position:relative;display:flex;justify-content:center;align-items:center;min-height:70px;padding:4px 10px 18px;border:0;background:transparent;color:#7198c6;font-size:clamp(16px,2vw,25px);font-weight:500;line-height:1.28;text-align:center}
.tab span{display:block}
.tab.active{color:var(--cyan);font-weight:700}
.tab.active:after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:92px;height:5px;border-radius:5px;background:var(--cyan);box-shadow:0 0 13px rgba(8,215,232,.18)}
.tools{display:grid;grid-template-columns:minmax(230px,31%) 1fr;gap:26px;margin-bottom:42px}
.revisit,.search-wrap{height:91px;border:2px solid #2b4365;border-radius:27px;background:#111c2c;box-shadow:none}
.revisit{display:flex;align-items:center;justify-content:center;gap:22px;color:#a8cbed;font-size:clamp(16px,2vw,25px);font-weight:600}
.revisit svg{width:43px;height:43px;stroke:#8bb9e8;stroke-width:2.3;fill:none}
.revisit:hover{border-color:#52749d;background:#132641}
.search-wrap{display:flex;align-items:center;padding:0 29px}
.search-wrap input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--white);font-size:clamp(18px,2.4vw,30px)}
.search-wrap input::placeholder{color:#536f94;opacity:1}
.search-wrap svg{width:42px;height:42px;flex:none;stroke:#8bb9e8;stroke-width:2.5;fill:none}
.list-head{display:flex;justify-content:space-between;align-items:center;color:#7ea6d3;font-size:clamp(17px,2.1vw,27px);font-weight:600;padding:0 11px 25px;border-bottom:2px solid #172b46;margin-bottom:27px}
.member-list{display:grid;gap:23px}
.member-card{position:relative;display:grid;grid-template-columns:1.05fr 1fr;min-height:0;padding:23px 29px;border:2px solid #385477;border-radius:30px;background:#111c2c;box-shadow:var(--shadow);overflow:hidden}
.member-card:after{content:"";position:absolute;bottom:-2px;left:20%;width:30%;height:3px;background:linear-gradient(90deg,transparent,#a8d0ff,transparent);filter:blur(1px)}
.member-left{padding:0 30px 0 0;border-right:2px solid #263d5b;display:flex;flex-direction:column;align-items:flex-start}
.member-index{font-size:21px;color:#8eb6df;font-weight:500;margin:0 0 13px}
.work-badge{border:2px solid #82b3e6;color:#b5d5f3;border-radius:28px;padding:6px 19px;font-size:18px;line-height:1.2;margin-bottom:30px;background:rgba(68,116,170,.12)}
.phone-number{font-size:clamp(24px,2.7vw,34px);font-weight:700;letter-spacing:-.8px;line-height:1.25;margin:0 0 27px;color:#f3f6fb;overflow-wrap:anywhere}
.customer-name{font-size:25px;color:#f0f4fb;min-height:32px}
.editable{cursor:pointer;transition:color .15s}
.editable:hover{color:#a9d7ff}
.member-right{padding-left:53px;display:flex;flex-direction:column;justify-content:flex-start;min-width:0}
.info-row{display:grid;grid-template-columns:54px minmax(0,1fr);gap:14px;align-items:center;padding:0 0 13px;margin:0 0 14px;border-bottom:1px solid #2a405f;min-width:0}
.info-row:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.info-icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#8dbbe9}
.info-icon svg{width:43px;height:43px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.info-label{font-size:19px;color:#83acd7;margin:1px 0 5px;line-height:1.2}
.status-pill{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:5px 20px;border-radius:30px;border:2px solid #13a957;background:#174d3a;color:#d9f2e6;font-size:19px;font-weight:600;box-shadow:none;max-width:100%;text-align:center}
.status-pill.waiting{background:#3b3223;border-color:#80683e;color:#ead7b5}
.status-pill.claim-wait{background:#26364a;border-color:#53677f;color:#d0dbea}
.value{font-size:clamp(22px,2.5vw,31px);font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.date-value{font-size:clamp(19px,2.1vw,27px);font-weight:500;line-height:1.35}
.check-circle{width:43px;height:43px;display:flex;align-items:center;justify-content:center;color:#36a978;background:transparent}
.check-circle svg{width:31px;height:31px;stroke:currentColor;stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.wait-circle{width:43px;height:43px;display:flex;align-items:center;justify-content:center;color:#c99b4d;background:transparent}
.wait-circle svg{width:27px;height:27px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.wallet svg{fill:none;stroke:#9aafc9;stroke-width:1.9}
.calendar svg{stroke:#8dbbe9}
.empty{padding:42px 20px;text-align:center;border:1px dashed #294363;border-radius:22px;color:#86a9cf;font-size:16px}
.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:13px 20px;border:1px solid #345477;border-radius:14px;background:#10233b;color:#eaf4ff;box-shadow:0 12px 35px #0008;transition:.22s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-backdrop{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(1,6,14,.78);backdrop-filter:blur(7px)}
.modal-backdrop.open{display:flex}
.modal{width:min(100%,590px);max-height:min(92vh,900px);overflow:auto;border:1px solid #395779;border-radius:25px;padding:25px;background:#111c2c;box-shadow:0 18px 55px #0008}
.modal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.modal h2{font-size:23px;margin:0}
.close{border:0;background:transparent;color:#9dbbda;font-size:28px;line-height:1}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;color:#8eafd2;font-weight:600}
.field input,.field select{width:100%;height:46px;border:1px solid #345273;border-radius:11px;background:#071426;color:#f4f7fc;padding:0 12px;outline:none}
.field input:focus,.field select:focus{border-color:#16c8df;box-shadow:0 0 0 2px #55b9c722}
.field small{color:#708eaf;font-size:11px}
.modal-actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:24px}
.action-right{display:flex;gap:10px}
.btn{border:1px solid #456487;border-radius:11px;padding:11px 17px;font-weight:700;color:#dcecff;background:#142944}
.btn.primary{background:#236a78;border-color:#398b98;color:#f4fbfc}
.btn.danger{background:#351923;border-color:#7b3448;color:#ffc6d0}
.btn:hover{filter:brightness(1.13)}
@media(max-width:700px){
 .app{padding:20px 16px 38px}
 h1{margin-bottom:18px}
 .timer-row{margin-bottom:25px;gap:10px}
 .timer{gap:5px;font-size:20px}
 .timer-box{min-width:49px;padding:8px 7px;border-radius:9px;border-width:1px}
 .timer-label{font-size:16px}
 .tabs{width:100%;margin-bottom:27px}
 .tab{font-size:15px;min-height:59px;padding:2px 4px 14px}
 .tab.active:after{width:65px;height:4px}
 .tools{grid-template-columns:1fr 1.65fr;gap:10px;margin-bottom:28px}
 .revisit,.search-wrap{height:58px;border-radius:16px}
 .revisit{gap:7px;font-size:12px;padding:0 5px}
 .revisit svg{width:25px;height:25px}
 .search-wrap{padding:0 11px}
 .search-wrap input{font-size:14px}
 .search-wrap svg{width:24px;height:24px}
 .list-head{font-size:14px;padding:0 5px 13px;margin-bottom:14px}
 .member-list{gap:14px}
 .member-card{grid-template-columns:.93fr 1.07fr;min-height:0;padding:13px 11px;border-radius:19px;gap:0}
 .member-left{padding-right:11px;border-right:1px solid #29405f}
 .member-index{font-size:12px;margin-bottom:9px}
 .work-badge{font-size:9px;padding:4px 7px;border-width:1px;margin-bottom:20px;white-space:normal}
 .phone-number{font-size:clamp(14px,3.8vw,18px);letter-spacing:-.4px;margin-bottom:17px}
 .customer-name{font-size:13px;min-height:18px}
 .member-right{padding-left:12px}
 .info-row{grid-template-columns:24px minmax(0,1fr);gap:6px;padding-bottom:7px;margin-bottom:8px;border-bottom-width:1px}
 .info-icon{width:23px;height:23px}
 .info-icon svg{width:23px;height:23px;stroke-width:2.2}
 .check-circle,.wait-circle{width:22px;height:22px}
 .check-circle svg{width:18px;height:18px}
 .wait-circle svg{width:17px;height:17px}
 .wait-circle{font-size:14px;border-width:2px}
 .info-label{font-size:10px;margin:1px 0 4px}
 .status-pill{min-height:22px;padding:3px 7px;font-size:9px;border-width:1px;white-space:normal;line-height:1.15}
 .value{font-size:clamp(12px,3.4vw,16px)}
 .date-value{font-size:clamp(9px,2.65vw,12px);overflow-wrap:anywhere}
 .modal{padding:19px;border-radius:20px}
 .modal h2{font-size:20px}
}
@media(max-width:370px){
 .app{padding-left:12px;padding-right:12px}
 .member-card{padding:14px 10px}
 .member-right{padding-left:9px}
 .info-row{grid-template-columns:22px minmax(0,1fr);gap:5px}
 .info-icon,.info-icon svg{width:21px;height:21px}
 .phone-number{font-size:14px}
 .status-pill{font-size:9px;padding:3px 6px}
 .form-grid{grid-template-columns:1fr}
 .field.full{grid-column:auto}
}
@media(min-width:701px) and (max-width:950px){
 .app{padding-left:25px;padding-right:25px}
 .member-card{min-height:470px;padding:25px}
 .member-right{padding-left:28px}
 .info-row{grid-template-columns:52px 1fr;gap:12px}
 .info-icon,.info-icon svg{width:43px;height:43px}
 .info-label{font-size:18px}
 .status-pill{font-size:18px;min-height:42px}
}
</style>
</head>
<body>
<main class="app">
  <h1>Telepon</h1>
  <section class="timer-row">
    <div class="timer-label">Waktu Tugas Berakhir</div>
    <div class="timer" aria-label="Hitung mundur">
      <span class="timer-box" id="hours">23</span><span class="timer-sep">:</span>
      <span class="timer-box" id="minutes">27</span><span class="timer-sep">:</span>
      <span class="timer-box" id="seconds">28</span>
    </div>
  </section>

  <nav class="tabs" aria-label="Filter data">
    <button class="tab active" data-filter="all"><span>Semua<br>(<b id="count-all">0</b>)</span></button>
    <button class="tab" data-filter="done"><span>Selesai (<b id="count-done">0</b>)</span></button>
    <button class="tab" data-filter="pending"><span>Belum Selesai<br>(<b id="count-pending">0</b>)</span></button>
  </nav>

  <section class="tools">
    <button class="revisit" id="revisitBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2z"/></svg>
      <span>Kunjungan Ulang</span>
    </button>
    <label class="search-wrap">
      <input id="searchInput" type="search" placeholder="Nomor / Pelanggan" autocomplete="off" aria-label="Cari nomor atau pelanggan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.3"/><path d="m16.2 16.2 5 5"/></svg>
    </label>
  </section>

  <div class="list-head"><span>Nomor &amp; Nama</span><span>Hasil</span></div>
  <section class="member-list" id="memberList" aria-live="polite"></section>
</main>

<div class="toast" id="toast" role="status"></div>

<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <form class="modal" id="editForm">
    <div class="modal-top"><h2 id="modalTitle">Edit Data Member</h2><button class="close" type="button" id="closeModal" aria-label="Tutup">×</button></div>
    <div class="form-grid">
      <div class="field full"><label for="editPhone">Nomor WhatsApp</label><input id="editPhone" type="text" inputmode="text" placeholder="6285342231719"></div>
      <div class="field full"><label for="editName">Nama pelanggan</label><input id="editName" type="text" placeholder="Nama pelanggan"></div>
      <div class="field"><label for="editWork">Status pengerjaan</label><select id="editWork"><option>Belum Selesai</option><option>Terpilih</option></select></div>
      <div class="field"><label for="editClaim">Status Klaim</label><select id="editClaim"><option>Sudah Klaim</option><option>Menunggu Registrasi</option></select></div>
      <div class="field"><label for="editAmount">Nominal WD</label><input id="editAmount" type="text" inputmode="decimal" placeholder="2500000"><small>Contoh: 1899766 atau 1.899.766,00</small></div>
      <div class="field"><label for="editWd">Status WD</label><select id="editWd"><option>Berhasil</option><option>Menunggu</option></select></div>
      <div class="field full"><label>Tanggal &amp; Waktu Data</label><input id="editDateDisplay" type="text" value="Otomatis mengikuti waktu perangkat" disabled><small>Tanggal selalu ditampilkan. Saat status WD menjadi Berhasil, waktu WD akan dicatat otomatis.</small></div>
    </div>
    <div class="modal-actions">
      <button class="btn danger" type="button" id="deleteBtn">Hapus Data</button>
      <div class="action-right"><button class="btn" type="button" id="cancelBtn">Batal</button><button class="btn primary" type="submit">Simpan</button></div>
    </div>
  </form>
</div>

<script>
(() => {
  const STORAGE_KEY = 'teleponDatabaseKlaim_v1';
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const toLocalInput = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const dateDisplay = value => {
    if (!value) return '—';
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return '—';
    return `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const normalizePhone = value => {
    let digits = String(value || '').replace(/\D/g,'');
    if (digits.startsWith('0')) digits = '62' + digits.slice(1);
    return digits;
  };
  const parseAmount = value => {
    let s = String(value ?? '').trim().replace(/\s/g,'');
    if (!s) return 0;
    // Input bertitik/koma dianggap format Indonesia; ambil angka dan dua desimal bila ada.
    if (s.includes(',') && /\d,\d{1,2}$/.test(s)) {
      s = s.replace(/\./g,'').replace(',','.');
      const n = Number(s); return Number.isFinite(n) ? n : 0;
    }
    s = s.replace(/[^\d-]/g,'');
    const n = Number(s); return Number.isFinite(n) ? n : 0;
  };
  const formatAmount = value => new Intl.NumberFormat('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(value)||0);
  const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const makeSeed = () => [
    {id:1,phone:'628135****2525',name:'-',work:'Belum Selesai',claim:'Sudah Klaim',amount:2500000,wd:'Berhasil',wdDate:'2026-11-13T18:45:00'},
    {id:2,phone:'6285342231719',name:'Pelanggan 02',work:'Belum Selesai',claim:'Menunggu Registrasi',amount:1899766,wd:'Menunggu',wdDate:''},
    {id:3,phone:'628579****7731',name:'Pelanggan 03',work:'Belum Selesai',claim:'Sudah Klaim',amount:100000,wd:'Menunggu',wdDate:''}
  ];
  let members;
  try { members = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e) { members = null; }
  if (!Array.isArray(members)) { members = makeSeed(); }
  members.forEach(m => { if (!m.recordDate) m.recordDate = m.wdDate || new Date().toISOString(); });
  save();
  function save(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(members)); }

  const list = document.getElementById('memberList');
  const search = document.getElementById('searchInput');
  const tabs = [...document.querySelectorAll('.tab')];
  const backdrop = document.getElementById('modalBackdrop');
  const form = document.getElementById('editForm');
  let activeFilter = 'all';
  let editingId = null;
  let toastTimer;

  const icons = {
    wallet:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 8V5.5A2.5 2.5 0 0 0 18 3H5.5a3 3 0 0 0 0 6H21v10.5A1.5 1.5 0 0 1 19.5 21h-14A3.5 3.5 0 0 1 2 17.5v-11"/><path d="M21 12h-5a2 2 0 0 0 0 4h5"/><path d="M16 14h.01"/></svg>',
    calendar:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
    check:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4.5 12.5 5 5L20 7"/></svg>'
  };
  function showToast(message){
    const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');
    clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300);
  }
  function statusIcon(success){
    return success
      ? `<span class="check-circle" aria-label="Berhasil">${icons.check}</span>`
      : '<span class="wait-circle" aria-label="Menunggu"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg></span>';
  }
  function render(){
    document.getElementById('count-all').textContent=members.length;
    document.getElementById('count-done').textContent=members.filter(m=>m.work==='Terpilih').length;
    document.getElementById('count-pending').textContent=members.filter(m=>m.work!=='Terpilih').length;
    const q=search.value.trim().toLowerCase();
    const filtered=members.filter(m=>{
      const filterOK=activeFilter==='all'||(activeFilter==='done'?m.work==='Terpilih':m.work!=='Terpilih');
      return filterOK&&(!q||`${m.phone} ${m.name}`.toLowerCase().includes(q));
    });
    if(!filtered.length){list.innerHTML='<div class="empty">Tidak ada data yang cocok.</div>';return;}
    list.innerHTML=filtered.slice(0,1).map(m=>{
      const claimClass=m.claim==='Sudah Klaim'?'':'claim-wait';
      const wdClass=m.wd==='Berhasil'?'':'waiting';
      const date=dateDisplay(m.wdDate || m.recordDate);
      return `<article class="member-card" data-id="${m.id}">
        <div class="member-left">
          <div class="member-index">#${members.indexOf(m)+1}</div>
          <button type="button" class="work-badge editable" data-edit="${m.id}" aria-label="Edit status pengerjaan">${escapeHTML(m.work)}</button>
          <div class="phone-number editable" data-edit="${m.id}" title="Klik untuk mengedit nomor">${escapeHTML(m.phone||'—')}</div>
          <div class="customer-name editable" data-edit="${m.id}" title="Klik untuk mengedit nama">${escapeHTML(m.name||'-')}</div>
        </div>
        <div class="member-right">
          <div class="info-row">
            <div class="info-icon">${statusIcon(m.claim==='Sudah Klaim')}</div>
            <div><div class="info-label">Status Klaim</div><button class="status-pill ${claimClass} editable" data-edit="${m.id}" type="button">${escapeHTML(m.claim)}</button></div>
          </div>
          <div class="info-row">
            <div class="info-icon wallet">${icons.wallet}</div>
            <div><div class="info-label">Nominal WD</div><div class="value editable" data-edit="${m.id}">Rp ${formatAmount(m.amount)}</div></div>
          </div>
          <div class="info-row">
            <div class="info-icon">${statusIcon(m.wd==='Berhasil')}</div>
            <div><div class="info-label">Status WD</div><button class="status-pill ${wdClass} editable" data-edit="${m.id}" type="button">${escapeHTML(m.wd)}</button></div>
          </div>
          <div class="info-row">
            <div class="info-icon calendar">${icons.calendar}</div>
            <div><div class="info-label">Tanggal &amp; Waktu</div><div class="date-value editable" data-edit="${m.id}">${date}</div></div>
          </div>
        </div>
      </article>`;
    }).join('');
  }
  function openModal(id){
    const m=members.find(x=>x.id===id);if(!m)return;
    editingId=id;
    document.getElementById('editPhone').value=m.phone||'';
    document.getElementById('editName').value=m.name==='-'?'':(m.name||'');
    document.getElementById('editWork').value=m.work||'Belum Selesai';
    document.getElementById('editClaim').value=m.claim||'Menunggu Registrasi';
    document.getElementById('editAmount').value=String(m.amount??0);
    document.getElementById('editWd').value=m.wd||'Menunggu';
    document.getElementById('editDateDisplay').value=dateDisplay(m.wdDate || m.recordDate);
    backdrop.classList.add('open');
    setTimeout(()=>document.getElementById('editPhone').focus(),40);
  }
  function closeModal(){backdrop.classList.remove('open');editingId=null;}
  list.addEventListener('click',e=>{
    const target=e.target.closest('[data-edit]');if(target)openModal(Number(target.dataset.edit));
  });
  tabs.forEach(tab=>tab.addEventListener('click',()=>{
    activeFilter=tab.dataset.filter;tabs.forEach(t=>t.classList.toggle('active',t===tab));render();
  }));
  search.addEventListener('input',render);
  document.getElementById('revisitBtn').addEventListener('click',()=>{
    search.value='';activeFilter='all';tabs.forEach(t=>t.classList.toggle('active',t.dataset.filter==='all'));render();showToast('Daftar diperbarui.');
  });
  document.getElementById('closeModal').addEventListener('click',closeModal);
  document.getElementById('cancelBtn').addEventListener('click',closeModal);
  backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeModal();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&backdrop.classList.contains('open'))closeModal();});
  form.addEventListener('submit',e=>{
    e.preventDefault();const m=members.find(x=>x.id===editingId);if(!m)return;
    const oldWd=m.wd;
    m.phone=normalizePhone(document.getElementById('editPhone').value);
    m.name=document.getElementById('editName').value.trim()||'-';
    m.work=document.getElementById('editWork').value;
    m.claim=document.getElementById('editClaim').value;
    m.amount=parseAmount(document.getElementById('editAmount').value);
    m.wd=document.getElementById('editWd').value;
    if(m.wd==='Berhasil'){
      if(oldWd!=='Berhasil'||!m.wdDate){m.wdDate=new Date().toISOString();}
    } else {m.wdDate='';}
    save();closeModal();render();showToast('Data member berhasil disimpan.');
  });
  document.getElementById('deleteBtn').addEventListener('click',()=>{
    const m=members.find(x=>x.id===editingId);if(!m)return;
    if(confirm(`Hapus data ${m.phone||'member ini'}? Data yang dihapus tidak dapat dikembalikan.`)){
      members=members.filter(x=>x.id!==editingId);save();closeModal();render();showToast('Data berhasil dihapus.');
    }
  });

  // Timer contoh: hitung mundur 23:27:28 sejak halaman dibuka.
  let remaining=23*3600+27*60+28;
  function tick(){
    const h=Math.floor(remaining/3600),mi=Math.floor((remaining%3600)/60),s=remaining%60;
    document.getElementById('hours').textContent=pad(h);
    document.getElementById('minutes').textContent=pad(mi);
    document.getElementById('seconds').textContent=pad(s);
    if(remaining>0)remaining--;
  }
  tick();setInterval(tick,1000);
  render();
})();
</script>
</body>
</html>
